name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Rebuild the processed data and confirm it matches what's committed
        run: |
          python analysis/county_risk_analysis.py
          git diff --exit-code -- data/processed/

      # Rendering can vary slightly by environment (fonts, freetype version),
      # so this checks the figure scripts run cleanly, not that pixels match.
      - name: Smoke-test the figure-generating scripts
        run: |
          python analysis/build_visuals.py
          test -s analysis/figures/roadrisk_at_a_glance.png
          test -s analysis/figures/how_the_program_works.png
          test -s analysis/figures/cost_vs_benefit_by_year.png
